    var r = scores(), k = r[0], c = C[k], href = buyHref(c);
    var alt = C[S.score[r[1]] >= 2 ? r[1] : RELATED[k]];
    return '<div class="eyebrow">Твоя свеча</div>' +
      '<section class="card stack fade">' + (c.img ? '<img class="photo" src="' + esc(c.img) + '" alt="' + esc(c.name) + '">' : '') + '<div><span class="tag">' + esc(c.kind) + (c.limited ? ' · лимитированная' : '') + '</span><h2>' + esc(c.name) + '</h2></div>' +
      '<div class="price"><b>' + rub(c.price) + '</b><s>' + rub(c.old) + '</s></div>' +
      '<p class="lead">' + esc(c.about) + '</p>' +
      '<div class="stack" style="gap:8px"><div class="eyebrow">Подойдёт, если</div><ul class="fit">' + c.fit.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div>' +
      '<p class="sub">' + esc(c.tip) + '</p>' +
      (href ? '<a class="btn primary full" href="' + esc(href) + '" data-act="buy" target="_blank" rel="noopener">Заказать свечу</a>' : '') +
      '</section>' +
      '<section class="card stack"><div class="eyebrow">Ещё может откликнуться</div><div class="alt"><div><div class="nm">' + esc(alt.name) + '</div><div class="sub">' + rub(alt.price) + ' вместо ' + rub(alt.old) + '</div></div>' +
      (buyHref(alt) ? '<a class="btn" href="' + esc(buyHref(alt)) + '" data-act="buy" target="_blank" rel="noopener">Смотреть</a>' : '') + '</div></section>' +
      (STEPS[k] ? '<section class="card stack"><div class="eyebrow">Если хочется пройти путь по шагам</div><p class="lead">' + esc(STEPS[k]) + '</p></section>' : '') +
      '<button class="btn ghost full" data-act="restart">Пройти тест ещё раз</button>' +
      '<p class="note">Свечи — это ритуал и атмосфера. Они не заменяют помощь врача, психолога, юриста или финансового консультанта и не гарантируют результата. Зажигай на ровной устойчивой поверхности, вдали от штор и бумаги, не оставляй горящую свечу без присмотра.</p>';
  }
  function render() {
    app.innerHTML = S.step < 0 ? intro() : (S.step < Q.length ? question() : result());
    window.scrollTo(0, 0);
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.dataset.act;
    if (a === 'start') { S.step = 0; S.picks = []; haptic(); render(); }
    else if (a === 'pick') { S.picks[S.step] = +t.dataset.i; S.picks.length = S.step + 1; S.step++; haptic(); render(); }
    else if (a === 'back') { S.step = Math.max(-1, S.step - 1); S.picks.length = Math.max(0, S.step); render(); }
    else if (a === 'restart') { S.step = -1; S.picks = []; render(); }
    else if (a === 'buy' && inTG && TG.openLink) { e.preventDefault(); try { TG.openLink(t.href); } catch (x) { location.href = t.href; } }
  });
  render();
})();
</script>
