<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0b1a">
<title>Трекер практик</title>
<style>
/* Шрифты лежат рядом с приложением: не зависят от Google Fonts */
@font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 400; font-display: swap; src: url('font-cormorant-garamond-italic-cyrillic.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 400; font-display: swap; src: url('font-cormorant-garamond-italic-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 300 500; font-display: swap; src: url('font-cormorant-garamond-normal-cyrillic.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Cormorant Garamond'; font-style: normal; font-weight: 300 500; font-display: swap; src: url('font-cormorant-garamond-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; font-display: swap; src: url('font-inter-normal-cyrillic.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 500; font-display: swap; src: url('font-inter-normal-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
/* Дизайн-система «Глубина» (SILA): всегда тёмная, фиолетовый как источник света, золото только для дат. */
:root {
  --void:#0e0b1a; --depth:#150f2b; --dusk:#1e1540; --mist:#2e2460;
  --purple:#7b5fd4; --purple-dark:#4a3698; --glow:#9b7fec; --tint:rgba(123,95,212,.2);
  --gold:#c9a84c; --gold-tint:rgba(201,168,76,.15);
  --tx:#f0eeff; --tx2:#c4bae8; --muted:#9d8fd4;
  --w1:#7b5fd4; --w2:#5e8fd6; --w3:#4aa3a8; --w4:#b46fc4; --w5:#d08aa5;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 2px 16px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--void); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--void); color: var(--tx); font-family: var(--sans); font-size: 15px; line-height: 1.7;
  padding-top: max(24px, calc(var(--tg-content-safe-area-inset-top, 0px) + var(--tg-safe-area-inset-top, 0px) + 12px));
  padding-bottom: max(48px, calc(env(safe-area-inset-bottom, 0px) + 32px), calc(var(--tg-safe-area-inset-bottom, 0px) + 32px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.app { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.eyebrow { font-size: 11px; line-height: 1.4; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(34px, 7vw, 46px); line-height: 1.1; letter-spacing: -.5px; margin: 6px 0 8px; text-wrap: balance; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.2; margin: 0; }
.lead { color: var(--tx2); max-width: 56ch; margin: 0; }
.head { display: flex; flex-direction: column; }

/* tabs */
.tabs { display: flex; gap: 6px; flex-wrap: nowrap; }
@media (max-width: 420px) { .tab { padding: 8px 11px !important; font-size: 13px !important; } }
.tab { border: .5px solid var(--mist); background: transparent; color: var(--tx2); padding: 8px 15px; border-radius: 40px; font-size: 14px; transition: background .15s, color .15s; }
.tab:hover { background: var(--tint); }
.tab[aria-selected="true"] { background: var(--purple); border-color: var(--purple); color: var(--tx); }

/* surfaces */
.card { background: var(--depth); border: .5px solid var(--mist); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.card-t { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.card-t .eyebrow { margin: 0; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--dusk); border: .5px solid var(--purple-dark); border-radius: 12px; padding: 12px 16px; font-size: 13px; color: var(--tx2); }
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.btn { border: 1.5px solid var(--purple-dark); background: transparent; color: var(--glow); border-radius: 40px; padding: 7px 18px; font-size: 13px; transition: background .15s, transform .1s; }
.btn:hover { background: var(--tint); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--purple); border-color: var(--purple); color: var(--tx); }
.btn.primary:hover { opacity: .88; background: var(--purple); }
.btn.ghost { border: .5px solid var(--mist); color: var(--tx2); }
.btn.sm { padding: 4px 12px; font-size: 12px; }
.icon-btn { width: 36px; height: 36px; border-radius: 40px; border: .5px solid var(--mist); background: transparent; color: var(--tx2); font-size: 18px; line-height: 1; display: inline-grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--tint); }
.icon-btn:disabled { opacity: .35; cursor: default; }

/* skeleton */
.sk { background: var(--depth); border: .5px solid var(--mist); border-radius: 12px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

/* month nav */
.mnav { display: flex; align-items: center; gap: 12px; }
.mnav .m { font-family: var(--serif); font-size: 30px; line-height: 1; min-width: 0; flex: 0 1 190px; text-align: center; }

/* overview */
.top { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .top { grid-template-columns: 300px minmax(0, 1fr); } }
.ringbox { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .p { font-family: var(--serif); font-size: 36px; line-height: 1; }
.ring .s { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
.facts { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--tx2); min-width: 0; }
.facts b { color: var(--tx); font-weight: 500; font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--sans); font-size: 12px; }
.chart .gl { stroke: var(--mist); stroke-width: .6; }
.chart .ln { fill: none; stroke: var(--glow); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--glow); }
.chart .val { fill: var(--tx); font-size: 13px; font-weight: 500; }

/* weeks */
.weeks { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.wk-card { background: var(--depth); border: .5px solid var(--mist); border-radius: 12px; padding: 14px 14px 12px; min-width: 0; }
.wk-h { display: flex; flex-direction: column; gap: 0; line-height: 1.4; border-bottom: 2px solid var(--c); padding-bottom: 6px; margin-bottom: 10px; font-size: 13px; }
.wk-h b { font-weight: 500; color: var(--tx); }
.wk-h span { color: var(--muted); font-size: 12px; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 76px; }
.bcol { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; min-width: 0; }
.bar { background: var(--c); border-radius: 3px 3px 0 0; min-height: 3px; }
.bar.fut { background: var(--mist); opacity: .5; }
.dl { display: flex; gap: 4px; margin-top: 4px; }
.dl span { flex: 1; text-align: center; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wk-f { margin-top: 8px; font-size: 12px; color: var(--tx2); font-variant-numeric: tabular-nums; }

/* grid */
.gridwrap { overflow-x: auto; margin: 0 -8px; padding: 0 8px 6px; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
table.g { border-collapse: separate; border-spacing: 0; }
.g th, .g td { padding: 0; font-weight: 400; }
.g th.nm, .g td.nm { position: sticky; left: 0; z-index: 2; background: var(--depth); min-width: 130px; max-width: 130px; text-align: left; padding: 3px 10px 3px 0; font-size: 13px; line-height: 1.3; color: var(--tx2); }
.g th.nm { vertical-align: bottom; }
.g th.wk { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--tx2); text-align: left; padding: 0 0 4px 6px; border-bottom: 2px solid var(--c); white-space: nowrap; }
.g th.dn { font-size: 12px; color: var(--tx2); text-align: center; padding-top: 6px; font-variant-numeric: tabular-nums; }
.g th.dw { font-size: 10px; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .5px; padding-bottom: 4px; }
.g th.today { color: var(--gold); }
.g th.dn.today { font-weight: 500; }
.g td.d { text-align: center; padding: 3px 2px; min-width: 32px; }
.g td.ws, .g th.ws { border-left: .5px solid var(--mist); }
.cell { width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--c); background: transparent; opacity: .5; padding: 0; display: inline-grid; place-items: center; color: var(--tx); transition: opacity .15s, background .15s; }
.cell:hover { opacity: 1; background: var(--tint); }
.cell.on { background: var(--c); opacity: 1; }
.cell svg { width: 14px; height: 14px; display: none; }
.cell.on svg { display: block; }

/* rank */
.rank { display: flex; flex-direction: column; gap: 14px; }
.rk { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.rk .n { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.rk .t { min-width: 0; overflow-wrap: anywhere; }
.rk .pc { font-variant-numeric: tabular-nums; color: var(--tx); font-size: 14px; }
.rk .bar-t { grid-column: 2 / 4; height: 6px; background: var(--mist); border-radius: 3px; overflow: hidden; }
.rk .bar-t i { display: block; height: 100%; background: linear-gradient(90deg, var(--purple), var(--glow)); border-radius: 3px; }
.rk .sr { grid-column: 2 / 4; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (min-width: 720px) { .rank { display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; } }

/* today */
.daybar { display: flex; align-items: center; gap: 6px; }
.daybar .icon-btn { width: 30px; }
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; flex: 1; min-width: 0; }
.dchip { border: .5px solid var(--mist); background: var(--depth); border-radius: 12px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 0; line-height: 1.3; min-width: 0; }
.dchip .w { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.dchip .n { font-size: 17px; font-variant-numeric: tabular-nums; }
.dchip .c { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dchip.tdy .n { color: var(--gold); }
.dchip[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); }
.dchip[aria-pressed="true"] .w, .dchip[aria-pressed="true"] .c { color: var(--tx); }
.dchip[aria-pressed="true"].tdy .n { color: var(--tx); }
.dateh { font-family: var(--serif); font-size: 30px; line-height: 1.15; color: var(--gold); margin: 0; }
.todayhead { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.prog { color: var(--tx2); font-size: 14px; font-variant-numeric: tabular-nums; }
.hl { display: flex; flex-direction: column; gap: 8px; }
.hrow { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; text-align: left; background: var(--depth); border: .5px solid var(--mist); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); transition: background .15s, border-color .15s; }
.hrow:hover { border-color: var(--purple-dark); }
.hrow .ck { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--glow); display: grid; place-items: center; flex: none; color: var(--tx); }
.hrow .ck svg { width: 15px; height: 15px; display: none; }
.hrow .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.hrow .sr { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hrow.on { background: var(--dusk); border-color: var(--purple-dark); }
.hrow.on .ck { background: var(--purple); border-color: var(--purple); }
.hrow.on .ck svg { display: block; }
.hrow.on .nm { color: var(--tx2); }

/* settings */
.srow { display: flex; align-items: center; gap: 8px; }
.srow input[type="text"] { flex: 1; min-width: 0; background: var(--void); border: 1px solid var(--mist); color: var(--tx); border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 16px; }
.srow input[type="text"]:focus { border-color: var(--purple); outline: none; }
.sl { display: flex; flex-direction: column; gap: 8px; }
.confirm { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--tx2); flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.status { text-align: center; font-size: 12px; color: var(--muted); margin: 0; min-height: 1.4em; }
.status.err { color: var(--gold); }
/* path: статусы и награды */
.lvbar { height: 6px; background: var(--mist); border-radius: 3px; overflow: hidden; }
.lvbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--purple), var(--glow)); border-radius: 3px; transition: width .4s; }
.stname { font-family: var(--serif); font-size: 38px; line-height: 1.1; margin: 2px 0 0; }
.levels { display: flex; gap: 8px; flex-wrap: wrap; }
.lv { border: .5px solid var(--mist); border-radius: 40px; padding: 3px 14px; font-size: 12px; color: var(--muted); }
.lv.past { color: var(--tx2); border-color: var(--purple-dark); }
.lv.on { background: var(--purple); border-color: var(--purple); color: var(--tx); }
.pstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pstat { background: var(--dusk); border-radius: 12px; padding: 12px 14px; }
.pstat b { display: block; font-family: var(--serif); font-size: 30px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.pstat span { font-size: 12px; color: var(--muted); }
.agrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.ach { border: .5px solid var(--mist); border-radius: 12px; padding: 14px; background: var(--depth); display: flex; flex-direction: column; gap: 6px; opacity: .65; min-width: 0; }
.ach.got { opacity: 1; background: var(--dusk); border-color: var(--glow); box-shadow: 0 0 18px rgba(155,127,236,.2); }
.ach .bd { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--mist); display: grid; place-items: center; color: var(--tx); }
.ach.got .bd { background: var(--purple); border-color: var(--purple); }
.ach .bd svg { width: 13px; height: 13px; display: none; }
.ach.got .bd svg { display: block; }
.ach .nm { font-family: var(--serif); font-size: 21px; line-height: 1.2; }
.ach .ds { font-size: 12px; color: var(--muted); line-height: 1.45; }
.ach .pg { height: 4px; background: var(--mist); border-radius: 2px; overflow: hidden; margin-top: auto; }
.ach .pg i { display: block; height: 100%; background: var(--glow); }
.ach .pv { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px) + var(--tg-safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--dusk); border: .5px solid var(--glow); box-shadow: 0 0 24px rgba(155,127,236,.35); border-radius: 12px; padding: 12px 20px; font-size: 14px; max-width: min(92vw, 420px); text-align: center; white-space: pre-line; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
/* карта дня */
.cardday { display: flex; align-items: center; gap: 16px; }
.cardday img { width: 64px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 8px; border: .5px solid var(--glow); box-shadow: 0 0 16px rgba(155,127,236,.3); flex: none; background: var(--dusk); }
.cardday .cd-b { display: flex; flex-direction: column; gap: 4px; min-width: 0; align-items: flex-start; }
.cardday .cd-t { font-family: var(--serif); font-size: 22px; line-height: 1.2; }
.ov { position: fixed; inset: 0; z-index: 60; background: rgba(14,11,26,.97); overflow-y: auto; -webkit-overflow-scrolling: touch; opacity: 0; transition: opacity .25s; }
.ov[hidden] { display: none; }
.ov.on { opacity: 1; }
.ov-in { max-width: 520px; margin: 0 auto; padding: max(20px, calc(var(--tg-content-safe-area-inset-top, 0px) + var(--tg-safe-area-inset-top, 0px) + 16px)) 16px max(40px, calc(env(safe-area-inset-bottom, 0px) + 32px)); display: flex; flex-direction: column; gap: 18px; align-items: stretch; }
.ov-x { align-self: flex-end; }
.ov-e { text-align: center; }
.flip { perspective: 1200px; width: min(68vw, 280px); aspect-ratio: 2 / 3; margin: 0 auto; cursor: pointer; }
.fl-in { position: relative; width: 100%; height: 100%; transition: transform .9s cubic-bezier(.4,.2,.2,1); transform-style: preserve-3d; }
.flip.done .fl-in { transform: rotateY(180deg); }
.flip:not(.done) .fl-in { animation: float 3.2s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.fl-b, .fl-f { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 12px; object-fit: cover; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 0 40px rgba(155,127,236,.35); background: var(--dusk); }
.fl-f { transform: rotateY(180deg); }
.ov-hint { text-align: center; color: var(--tx2); font-size: 14px; }
.ov-txt { display: flex; flex-direction: column; gap: 16px; animation: fade .5s ease; }
.ov-date { text-align: center; font-family: var(--serif); font-size: 22px; color: var(--gold); line-height: 1.2; }
.ov-name { text-align: center; font-family: var(--serif); font-size: clamp(32px, 9vw, 42px); font-weight: 400; line-height: 1.1; margin: 0; }
.ov-key { text-align: center; font-family: var(--serif); font-style: italic; font-size: 21px; line-height: 1.4; color: var(--tx); }
.ov-sec { background: var(--depth); border: .5px solid var(--mist); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.ov-sec p { margin: 0; color: var(--tx2); }
.ov-cta { background: var(--dusk); border: .5px solid var(--purple-dark); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.ov-cta p { margin: 0; color: var(--tx2); font-size: 14px; }
/* дневник практик: заметки и метки */
.hwrap { display: flex; gap: 8px; align-items: stretch; }
.hwrap .hrow { flex: 1; min-width: 0; width: auto; }
.nbtn { width: 52px; flex: none; border: .5px solid var(--mist); background: var(--depth); border-radius: 12px; display: grid; place-items: center; color: var(--tx2); box-shadow: var(--shadow); }
.nbtn:hover { border-color: var(--purple-dark); }
.nbtn.has { border-color: var(--glow); color: var(--glow); background: var(--dusk); }
.nbtn svg { width: 18px; height: 18px; }
.sheet { position: fixed; inset: 0; z-index: 70; background: rgba(14,11,26,.82); display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }

  var MEDS = [{"id":"light","file":"med-pervyj-svet.mp3","title":"Первый свет","min":5,"when":"утро","desc":"Тихая практика на каждый день. В центре груди вы находите крошечный огонёк, как свеча в тёмной комнате, и просто остаётесь рядом с ним. Подходит, когда на длинную практику нет времени."},{"id":"goodday","file":"med-horoshij-den.mp3","title":"Медитация на хороший день","min":14,"when":"утро","desc":"Расслабление тела, затем подъём настроения по шкале до десяти баллов и настрой «сегодня самый лучший день». Хорошо слушать утром, до того как день набрал обороты."},{"id":"soft","file":"med-myagkost.mp3","title":"Мягкость и забота о себе","min":11,"when":"вечер","desc":"Рука на сердце, тёплый свет внутри и право уставать, чувствовать и останавливаться. Для вечера или для дня, когда вы слишком строго к себе относились."},{"id":"resource","file":"med-resurs.mp3","title":"Медитация ресурса","min":8,"when":"днём","desc":"Навстречу вам идёт шар света, вы помещаете его в грудь, и тепло расходится по всему телу. Помогает перезагрузиться, когда сил мало, а дел ещё много."},{"id":"home","file":"med-telo-dom.mp3","title":"Моё тело — мой дом","min":16,"when":"вечер","desc":"Вы проходите вниманием по всему телу и благодарите его за то, что оно несёт вас каждый день. Для тех, кто привык замечать тело, только когда оно болит или не нравится."},{"id":"forgive","file":"med-proshchenie.mp3","title":"Прощение себя","min":6,"when":"вечер","desc":"Вы вспоминаете ситуацию, где остались вина или недовольство собой, смотрите на себя тогдашнюю с мягкостью и говорите «я прощаю себя». Найдите место, где вас никто не потревожит."},{"id":"past","file":"med-proshloe.mp3","title":"Освобождение от прошлого","min":7,"when":"вечер","desc":"Вы стоите на берегу тёмной реки времени и по одному опускаете на воду воспоминания, обиды и незакрытые истории. Река светлеет, а на другом берегу виден свет будущего."},{"id":"future","file":"med-budushchee.mp3","title":"Я в своём будущем","min":22,"when":"начало недели","desc":"Вы смотрите на себя через полгода: утро, день и вечер, затем встречаетесь с собой из будущего и спрашиваете, что помогло прийти туда. Самая длинная запись. Берите её, когда есть время, например в начале недели или месяца."}];

  /* PAID-BEGIN */
  var PAID = {"products":[{"key":"pack-money","title":"Деньги и изобилие","tagline":"Место, где деньгам можно быть","kind":"pack"},{"key":"pack-body","title":"Тело и опора","tagline":"Опора под ногами","kind":"pack"},{"key":"pack-heart","title":"Сердце и принятие","tagline":"Мягкое сердце","kind":"pack"},{"key":"pack-release","title":"Отпускание и очищение","tagline":"Лёгкость","kind":"pack"},{"key":"pack-future","title":"Будущее и действие","tagline":"Шаг вперёд","kind":"pack"},{"key":"rod-nest","title":"Родовое гнездо","tagline":"Место, где тебя признаёт Род","kind":"single"},{"key":"all","title":"Вся коллекция","tagline":"Все платные медитации сразу","kind":"all"}],"singles":["money-hypnosis","safe-money","new-level","activation","best-year","lotus","inner-child","calm-closeness","manifest","empress","ground"],"meds":[{"id":"money-hypnosis","pack":"pack-money","title":"Денежный гипноз","min":19,"desc":"Самая глубокая практика пакета. Перед началом вы берёте в руки настоящие деньги, купюры или монеты, шуршите ими, звените, настраиваетесь на контакт. Потом погружение: золотая комната, образы, закрепление нового состояния.","note":"Нужны живые деньги под рукой и 20 минут тишины."},{"id":"money-med","pack":"pack-money","title":"Денежная медитация","min":9,"desc":"Короткая настройка. Вы оказываетесь в месте неограниченных возможностей и проговариваете установки про деньги, работу в радость и достойный доход. Подходит на утро или перед важным днём."},{"id":"money-rain","pack":"pack-money","title":"Денежный дождь","min":11,"desc":"Яркая образная практика. Золотой шар света над макушкой, поток изобилия через всё тело, место, где вы делаете то, что даёт вам больше всего ресурса. Заканчивается честно: вы берёте ровно столько, сколько готовы взять сейчас."},{"id":"abundance-home","pack":"pack-money","title":"Изобилие и процветание в дом","min":14,"desc":"Практика про дом как про пространство для денег. Вы открываете дверь, за которой желания уже воплощены, смотрите, кто рядом, чем наполнен воздух. В конце благодарность своему дому."},{"id":"safe-money","pack":"pack-money","title":"Место, где деньгам безопасно","min":11,"desc":"Мягкая практика без напора и без утверждений. Сканирование тела, внимание к ощущениям и мысль о том, что деньги часто не приходят не потому, что нельзя, а потому, что внутри нет места, где им безопасно."},{"id":"new-level","pack":"pack-money","title":"Новый уровень","min":12,"desc":"Практика про «уровень нормы». Дыхание на четыре счёта, два луча света соединяются в груди и расширяют привычные представления о том, что для вас допустимо. Для тех, кто выходит на новые суммы и чувствует внутренний предел."},{"id":"new-opps","pack":"pack-money","title":"Медитация новых возможностей","min":13,"desc":"Чужие установки и мнения уходят через стопы, сверху струится бело-жемчужный свет новых начинаний и открытых дверей. Хорошо слушать на пороге нового этапа: запуск, переезд, смена работы."},{"id":"ground","pack":"pack-body","title":"Заземление","min":16,"desc":"Вы лежите и чувствуете самые тяжёлые части тела, делаете их ещё тяжелее и теплее, благодарите руки за работу и позволяете себе растечься по поверхности. Для вечера и перегруженных дней."},{"id":"body-resources","pack":"pack-body","title":"Ресурсы моего тела","min":18,"desc":"Практика начинается с людей, с которыми остались нерешённые вопросы, а затем идёт по телу снизу вверх: стопы, бёдра, таз. Заканчивается утверждениями о силе и ресурсе. Для восстановления после напряжённого периода."},{"id":"resource-support","pack":"pack-body","title":"Ресурсность и опора","min":8,"desc":"Внимание идёт по стопам, палец за пальцем. От копчика поднимается золотистое тепло и разливается по всему телу. Короткая, подходит в середине дня."},{"id":"lean-on-self","pack":"pack-body","title":"Я опираюсь на себя","min":16,"desc":"Вы стоите босиком посреди тёплого летнего поля. Тепло земли поднимается по телу, вы вспоминаете момент, когда справились, и берёте из него опору."},{"id":"safety","pack":"pack-body","title":"Медитация на безопасность","min":11,"desc":"Стопы твёрдо стоят на полу, рука ложится туда, где больше всего нужна поддержка. Вы встречаете маленького себя и говорите ему: «Я здесь». Практика закрепляет чувство, что это ваше место и вы в безопасности."},{"id":"right-to-live","pack":"pack-body","title":"Ты имеешь право на жизнь","min":11,"desc":"Телесная практика: вы лежите на полу, стопы упираются в стену. Через дыхание и воспоминание отпускаете то, что тело держало в себе, и возвращаетесь к ощущению лёгкости.","note":"Практика эмоционально глубокая, включает задержку дыхания. Выбирайте её в спокойный день и в безопасном месте."},{"id":"pelvis","pack":"pack-body","title":"Транс на таз 18+","min":20,"desc":"Расслабление через область таза, где чаще всего копится зажатость. Нужен мягкий роллер из свёрнутого полотенца, круговые движения и дыхание с напряжением и расслаблением.","note":"Только для взрослых. Нужны подготовка и 20–30 минут времени."},{"id":"moderation","pack":"pack-body","title":"Медитация умеренность","min":7,"desc":"Вдох через голову, выдох в живот, ладонь на солнечном сплетении. Вы заходите в ровное состояние и смотрите, как меняется жизнь, когда в ней есть умеренность. Для тех, кто живёт на разгоне и забывает остановиться."},{"id":"lotus","pack":"pack-heart","title":"Лотос в груди","min":15,"desc":"Вы лежите и находите в центре груди лотос. Из него выходят белые нити тёплой, исцеляющей энергии и расходятся по всему телу: шея, лицо, диафрагма, живот, спина.","note":"Нужно 10–15 минут для себя и тихое место."},{"id":"open-heart","pack":"pack-heart","title":"Медитация открытого сердца","min":13,"desc":"Динамическая практика, делается сидя. Вы встряхиваете напряжение из головы и плеч и приходите к сердцу: какого оно размера, какое по цвету, тёплое оно или похоже на замёрзший шар. Менять ничего не нужно, только увидеть."},{"id":"living-heart","pack":"pack-heart","title":"Живое сердце","min":12,"desc":"Раскрытие энергии любви и принятия. Любовь не добавляется снаружи, она появляется, когда уходит внутреннее напряжение. Вы соединяете опору внизу с центром сердца и ждёте, пока в груди появится тепло."},{"id":"calm-closeness","pack":"pack-heart","title":"Спокойная близость","min":10,"desc":"Корни из стоп в землю, образ близкого человека и фраза: «Я позволяю тебе быть таким, какой ты есть, и позволяю себе быть собой рядом с тобой». Для тех, кто хочет быть рядом и оставаться собой."},{"id":"accept-self","pack":"pack-heart","title":"Я принимаю себя","min":10,"desc":"Безусловное принятие без борьбы с собой. «Мне можно быть такой. Я могу быть разной, и я имею на это право». Рука на сердце, тепло в груди, возвращение с вопросом: что изменилось в теле."},{"id":"inner-child","pack":"pack-heart","title":"Соединение с внутренним ребёнком","min":10,"desc":"Короткое объяснение про три части личности: внутренний родитель, взрослый и ребёнок. Затем встреча с малышом, объятие и слова: «Ты здесь, я тебя вижу, ты важная часть меня». Для тех, кто привык себя критиковать."},{"id":"empress","pack":"pack-heart","title":"Я императрица","min":11,"desc":"Янтарный огонёк в животе, там, где живёт женская сила. Образ себя в полной силе, красоте и притяжении. «Я позволяю себе получать. Я расцветаю». Короткая практика для женщин, удобно слушать утром."},{"id":"purify","pack":"pack-release","title":"Медитация очищения","min":17,"desc":"Работа с убеждениями, которые питают тревогу и стресс. Вы замечаете чувство в теле, даёте ему форму и отпускаете, а затем вспоминаете ситуацию, когда сами поддерживали другого человека, и берёте оттуда опору для себя."},{"id":"fears-blocks","pack":"pack-release","title":"Избавление от страхов и блоков","min":11,"desc":"Страхи и установки навешивают родители, общество, окружение, и они не ваши. Вы находите «маленький комочек», который мешает действовать, задаёте ему вопрос и смотрите, что приходит в ответ."},{"id":"release-fear","pack":"pack-release","title":"Отпускаю страх","min":9,"desc":"Короткая практика про страх безденежья. Вы видите его как тёмное облако в груди или животе, говорите ему: «Я вижу тебя, спасибо, что защищал, а теперь я выбираю отпустить» и наблюдаете, как на его месте появляется тёплый золотистый свет."},{"id":"i-release","pack":"pack-release","title":"Я отпускаю","min":13,"desc":"Отпускание без боли и усилий: вы разжимаете руки, в которых давно что-то держали. У воды говорите себе: «Я отпускаю то, что больше не моё». Не нужно знать, что именно."},{"id":"activation-intro","pack":"pack-future","title":"Активация к действию. Введение","min":2,"desc":"Короткое вступление к практике «Активация к действию». Послушайте его один раз перед первым погружением."},{"id":"activation","pack":"pack-future","title":"Активация к действию","min":22,"desc":"Гипноз для старта. Хорошо делать в начале лунного цикла или перед переездом, новой работой, расставанием со старым. Можно зайти с запросом, а можно довериться потоку, и сознание само выведет к нужной теме.","note":"Нужны 15–20 минут тишины и место, где можно лечь."},{"id":"remember-future","pack":"pack-future","title":"Вспоминая будущее","min":7,"desc":"У каждого уже есть прописанная история жизни. Вы выходите из комнаты своего будущего и смотрите: какой дом, кто рядом, чем вы заняты, кому помогаете. Короткая практика на каждый день, рекомендуется 30 дней подряд."},{"id":"best-year","pack":"pack-future","title":"Гипнотический транс на лучший год","min":20,"desc":"Мягкий гипноз с длинными плавными фразами. Дыхание как волны, проживание хорошего опыта всем телом и перенос его в будущий год. Хорошо слушать перед днём рождения и на рубеже года."},{"id":"manifest","pack":"pack-future","title":"Проявленность","min":8,"desc":"Распаковка проявленности. Вы чувствуете силу в голосе и руках, ощущение собственной значимости расширяется. Для экспертов, мастеров и всех, кто собирается показываться и пока сомневается."},{"id":"least-effort","pack":"pack-future","title":"Медитация наименьшего усилия","min":12,"desc":"Получать можно без изматывающего труда: достаточно быть в потоке, в принятии и в доверии. Вы соединяетесь с сердцем и Высшим Я, по телу разливается принятие. Для тех, кто привык тянуть всё на себе."},{"id":"potential","pack":"pack-future","title":"Встреча с потенциалом","min":10,"desc":"Лес, тропа в сторону, круглая чаша воды, похожая на зеркало. Вы задаёте источнику вопрос: что во мне уже есть, но пока не используется? Ответ может прийти образом, словом или ощущением."},{"id":"nest-1","pack":"rod-nest","title":"Родовое гнездо. Часть 1. Введение","min":11,"desc":"Как выбрать своё родовое гнездо и что делать, если места нет. Как работать с воспоминанием, если с ним связано неприятное. Несколько вариантов практики, чтобы каждый нашёл свой."},{"id":"nest-2","pack":"rod-nest","title":"Родовое гнездо. Часть 2. Практика","min":19,"desc":"Корни из стоп, путь в гнездо, встреча с семьёй и с поколениями, которых вы можете не помнить, благодарность Роду и возвращение в тело. Практику можно пройти быстро или долго и возвращаться в гнездо, когда нужна опора."}]};
  /* PAID-END */
  var REMIND_API = 'https://tracker-reminders.stasia-silaeva.workers.dev';
  var LITA = [{"n":1,"name":"Поток","key":"Жизнь всегда движется. Если что-то остановилось, пришло время убрать препятствие.","self":"Ты в безопасности, чтобы двигаться вперёд.","practice":"Написать список того, что больше не хочется нести дальше, и символически отпустить.","affirm":"Я доверяю потоку жизни и позволяю энергии свободно течь через меня."},{"n":2,"name":"Корни","key":"Твоя сила глубже, чем ты думаешь.","self":"Тебе не нужно всё нести одной.","practice":"Посмотреть фотографии предков и поблагодарить их.","affirm":"Я принимаю силу своего рода."},{"n":3,"name":"Тепло солнца","key":"Ты создана, чтобы сиять.","self":"Твой свет нужен миру.","practice":"Сделать что-то красивое для себя.","affirm":"Я позволяю себе сиять."},{"n":4,"name":"Право иметь","key":"Ты имеешь право получать.","self":"Ты достойна большего.","practice":"Написать 100 желаний.","affirm":"Я имею право жить в изобилии."},{"n":5,"name":"Зеркало","key":"Мир отражает то, что живёт внутри.","self":"Всё, что ты ищешь, начинается в тебе.","practice":"Записать три качества, которые раздражают в других людях, и спросить — где это есть во мне.","affirm":"Я готова видеть себя честно."},{"n":6,"name":"Тишина","key":"Ответы приходят в тишине.","self":"В тишине я расскажу тебе больше, чем в шуме.","practice":"Час без телефона и разговоров.","affirm":"В тишине я слышу свою душу."},{"n":7,"name":"Огонь","key":"Назови своё желание.","self":"Твой огонь — это твоя жизненная сила, а не угроза.","practice":"Признаться себе в истинном желании.","affirm":"Я разрешаю своему огню гореть."},{"n":8,"name":"Граница","key":"Твоё «нет» тоже священно.","self":"Граница защищает твою силу, а не отрезает любовь.","practice":"Сказать одно честное «нет».","affirm":"Мои границы священны."},{"n":9,"name":"Доверие","key":"Не всё нужно контролировать.","self":"Жизнь поддерживает тех, кто перестаёт бороться с течением.","practice":"Передать Вселенной одну проблему — мысленно или письменно.","affirm":"Жизнь поддерживает меня."},{"n":10,"name":"Урожай","key":"Пришло время собрать свои плоды.","self":"Ты заслужила увидеть плоды своих усилий.","practice":"Записать 50 своих побед.","affirm":"Я принимаю плоды своего труда."},{"n":11,"name":"Расширение","key":"Старые рамки стали тебе малы — и это не кризис, а рост.","self":"Пространство уже готово принять тебя в новом масштабе.","practice":"Назвать вслух, что в жизни уже стало мало.","affirm":"Мне разрешено расширяться."},{"n":12,"name":"Освобождение","key":"Ты уже выросла из этого — держаться больше не нужно.","self":"Отпускание — это акт силы, а не поражения.","practice":"Мысленно перерезать нить, связывающую с тем, что хочется отпустить.","affirm":"Я отпускаю то, что пережило себя."},{"n":13,"name":"Сила рода","key":"За тобой стоит больше поддержки, чем ты позволяешь себе чувствовать.","self":"Поддержка рода доступна без необходимости заслуживать её.","practice":"Мысленно попросить поддержки у тех, кто был до вас.","affirm":"Я принимаю силу своего рода."},{"n":14,"name":"Новый цикл","key":"Это пик одного цикла и начало следующего.","self":"Ты готова войти в новый цикл легче, чем думаешь.","practice":"Назвать, что хочется оставить позади, прежде чем шагнуть дальше.","affirm":"Я благодарю прошедший цикл и готова к новому."},{"n":15,"name":"Изобилие","key":"Вокруг уже больше ресурса, чем кажется.","self":"Ты можешь видеть полноту жизни прямо сейчас.","practice":"Назвать вслух три вещи, которые уже есть в избытке.","affirm":"Я живу в изобилии, которое уже окружает меня."},{"n":16,"name":"Дыхание","key":"Один вдох — и ты уже здесь.","self":"В теле, не в мыслях, ты найдёшь меня.","practice":"Вдох на четыре счёта, задержка на два, выдох на шесть — трижды.","affirm":"Я возвращаюсь в тело через дыхание."},{"n":17,"name":"Пробуждение","key":"Внутри уже что-то изменилось, даже если снаружи всё по-старому.","self":"Внешний мир догонит твой внутренний сдвиг.","practice":"Записать одну мысль, которая ощущается как «точка невозврата».","affirm":"Я доверяю своему внутреннему пробуждению."},{"n":18,"name":"Импульс","key":"Внутри всё готово — пора сделать действие, которое откладывается.","self":"Момент для действия уже наступил.","practice":"Сделать первый, даже маленький шаг к отложенному делу.","affirm":"Я действую, когда внутри всё готово."},{"n":19,"name":"Баланс","key":"Отдых и действие одинаково важны.","self":"Баланс — это тоже форма мудрости, а не слабости.","practice":"На сегодня сознательно выбрать на одно дело меньше, чем планировалось.","affirm":"Я живу в балансе действия и покоя."},{"n":20,"name":"Восстановление","key":"Тело копит силу в покое, а не в рывке.","self":"Покой возвращает тебе силу быстрее, чем любой рывок.","practice":"Позволить себе тридцать минут отдыха без чувства вины.","affirm":"Мне разрешено отдыхать без причины."},{"n":21,"name":"Голос","key":"То, что молчало внутри — пора сказать, сначала себе.","self":"Твой голос — не угроза для других, а твоя целостность.","practice":"Произнести вслух одну честную фразу о текущем чувстве.","affirm":"Я говорю правду спокойно и ясно."},{"n":22,"name":"Близость","key":"Настоящая близость начинается там, где снята маска «всё хорошо».","self":"Тебя можно любить такой, какая ты есть, без маски.","practice":"Сказать близкому человеку одну искреннюю, не дежурную фразу о своих чувствах.","affirm":"Я разрешаю себе быть увиденной по-настоящему."},{"n":23,"name":"Нежность","key":"Сила и нежность могут жить в одном человеке.","self":"Твоя нежность — это тоже сила, не уступка.","practice":"Сделать один мягкий, неторопливый жест заботы о себе.","affirm":"Мне можно быть нежной."},{"n":24,"name":"Со-настройка","key":"В отношениях важнее услышать, чем доказать правоту.","self":"Связь важнее победы в споре.","practice":"В следующем разговоре сначала переспросить, а не сразу возразить.","affirm":"Я готова услышать, а не только быть услышанной."},{"n":25,"name":"Прощение себе","key":"Прости себе тот шаг, который казался ошибкой — он был частью пути.","self":"Ты делала так, ка     var cn = todayCardN(), cc = cn ? cardById(cn) : null;
    var cardBlock = '<section class="card cardday"><img src="' + (cc ? cardImg(cn) : 'lita-back.webp') + '" alt="" loading="lazy"><div class="cd-b"><span class="eyebrow">Карта дня</span>' +
      (cc ? '<div class="cd-t">' + esc(cc.name) + '</div><button class="btn sm" data-act="drawcard" data-k="drawcard">Открыть</button>' : '<div class="cd-t">Энергии Литы</div><button class="btn primary sm" data-act="drawcard" data-k="drawcard">Вытянуть карту</button>') + '</div></section>';
    return demoBanner() +
      '<div class="daybar"><button class="icon-btn" data-act="wk" data-v="-7" aria-label="Предыдущая неделя" data-k="wprev">‹</button><div class="strip">' + chips + '</div><button class="icon-btn" data-act="wk" data-v="7" aria-label="Следующая неделя" data-k="wnext">›</button></div>' +
      '<div class="todayhead"><div><div class="eyebrow">' + WD_FULL[wi] + '</div><h2 class="dateh">' + s.d + ' ' + MONTHS_G[s.m] + '</h2></div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn sm" data-act="topath" data-k="topath">' + LEVELS[levelIdx(progress().days)].n + ' · серия ' + progress().streak + '</button><span class="prog">Отмечено ' + done + ' из ' + n + '</span>' + (isToday ? '' : '<button class="btn sm" data-act="gotoday" data-k="gotoday">Вернуться к сегодня</button>') + '</div></div>' +
      (isToday ? cardBlock + wheelBlock() + moonBlock() + medBlock() + prayBlock() : '') + '<div class="hl">' + rows + '</div>';
  }

  function habitsView() {
    if (UI.journal) return journalView(UI.journal);
    var n = S.habits.length;
    var rows = S.habits.map(function (h, i) {
      var del = UI.confirm === 'del:' + h.id;
      return '<div class="stack" style="gap:6px"><div class="srow"><input type="text" id="hn-' + esc(h.id) + '" data-hid="' + esc(h.id) + '" value="' + esc(h.name) + '" maxlength="40" aria-label="Название практики ' + (i + 1) + '">' +
        '<button class="icon-btn" data-act="up" data-hid="' + esc(h.id) + '" aria-label="Выше" ' + (i === 0 ? 'disabled' : '') + ' data-k="up-' + esc(h.id) + '">↑</button>' +
        '<button class="icon-btn" data-act="down" data-hid="' + esc(h.id) + '" aria-label="Ниже" ' + (i === n - 1 ? 'disabled' : '') + ' data-k="dn-' + esc(h.id) + '">↓</button>' +
        '<button class="icon-btn" data-act="del" data-hid="' + esc(h.id) + '" aria-label="Удалить практику" ' + (n <= 1 ? 'disabled' : '') + ' data-k="del-' + esc(h.id) + '">×</button></div>' +
        '<button class="btn sm ghost" style="align-self:flex-start" data-act="journal" data-hid="' + esc(h.id) + '" data-k="jr-' + esc(h.id) + '">Дневник · ' + noteList(h.id).length + '</button>' +
        (del ? '<div class="confirm">Удалить эту практику вместе с отметками и заметками? <button class="btn sm" data-act="delyes" data-hid="' + esc(h.id) + '" data-k="delyes">Удалить</button><button class="btn sm ghost" data-act="no" data-k="no">Оставить</button></div>' : '') + '</div>';
    }).join('');
    var reset = UI.confirm === 'reset' ?
      '<div class="confirm">Все отметки за все месяцы исчезнут. Продолжить? <button class="btn sm" data-act="resetyes" data-k="resetyes">Очистить</button><button class="btn sm ghost" data-act="no" data-k="no">Отмена</button></div>' :
      '<button class="btn ghost" data-act="reset" data-k="reset" style="align-self:flex-start">Очистить все отметки</button>';
    var where = useCloud ? 'Данные хранятся в вашем аккаунте Telegram и видны на всех ваших устройствах.' : 'Сейчас данные хранятся только в этом браузере.';
    return demoBanner() +
      '<section class="card stack"><div class="card-t" style="margin:0"><span class="eyebrow">Список практик</span><span class="note">' + n + ' из ' + MAXH + '</span></div><div class="sl">' + rows + '</div>' +
      (n < MAXH ? '<div class="srow"><input type="text" id="newHabit" placeholder="Новая практика" maxlength="40" aria-label="Название новой практики"><button class="btn primary" data-act="add" data-k="add">Добавить</button></div>' : '<p class="note">Достигнут предел в ' + MAXH + ' практик. Удалите ненужную, чтобы добавить новую.</p>') + '</section>' +
      remSection() + '<section class="card stack"><div class="card-t" style="margin:0"><span class="eyebrow">Данные</span></div><p class="note">Ваш трекер видите только вы. Названия практик можно менять в любой момент, отметки сохраняются. ' + where + '</p>' + reset + '</section>';
  }

  /* ---------- отрисовка ---------- */
  function render() {
    var act = document.activeElement, fk = act && act.dataset ? act.dataset.k : null;
    var gw = document.querySelector('.gridwrap'), sl = gw ? gw.scrollLeft : null, sy = window.scrollY;
    document.getElementById('tabs').innerHTML = tabsHtml();
    var v = document.getElementById('view');
    if (S.loadErr) { v.innerHTML = errorView(); return; }
    if (!S.ready) { v.innerHTML = skeleton(); return; }
    hit('open'); hit(UI.tab);
    v.innerHTML = UI.tab === 'today' ? todayView() : (UI.tab === 'habits' ? habitsView() : (UI.tab === 'path' ? pathView() : monthView()));
    var g2 = document.querySelector('.gridwrap');
    if (g2) {
      if (!UI.scrolled) {
        UI.scrolled = true;
        if (UI.vy === TY && UI.vm === TM) g2.scrollLeft = Math.max(0, (TD - 1) * 32 - 100); else g2.scrollLeft = 0;
      } else if (sl != null) g2.scrollLeft = sl;
    }
    window.scrollTo(0, sy);
    if (fk) { var el = document.querySelector('[data-k="' + fk + '"]'); if (el) { try { el.focus({ preventScroll: true }); } catch (e) {} } }
  }

  /* ---------- события ---------- */
  document.addEventListener('click', function (e) {
    if (e.target === sheetEl) { closeSheet(); return; }
    var t = e.target.closest('[data-act]'); if (!t) return;
    var a = t.dataset.act, hid = t.dataset.hid;
    if (a === 'retry') { load(); return; }
    if (a === 'closecard') { closeCard(); return; }
    if (a === 'circlehow') { openCircleHow(); return; }
    if (a === 'flip') { if (!todayCardN()) drawCard(); return; }
    if (a === 'buylink') hit('shop');
    if (a === 'buylink' && inTG && TG.openLink) { e.preventDefault(); try { TG.openLink(t.href); } catch (x) { location.href = t.href; } return; }
    if (a === 'invitelink' && inTG && TG.openLink) { e.preventDefault(); try { TG.openLink(t.href); } catch (x) { location.href = t.href; } return; }
    if (a === 'litalink' && inTG && TG.openLink) { e.preventDefault(); try { TG.openLink(t.href); } catch (x) { location.href = t.href; } return; }
    if (!S.ready) return;
    if (a === 'drawcard') { hit('card'); openCard(); return; }
    if (a === 'pray') { hit('pray'); openPrayer(t.dataset.id); return; }
    if (a === 'med') { hit('med'); openMed(t.dataset.id); return; }
    if (a === 'medlist') { hit('med'); openMedList(); return; }
    if (a === 'pack') { hit('shop'); openPack(t.dataset.key); return; }
    if (a === 'codeopen') { hit('shop'); openCode(); return; }
    if (a === 'codeapply') { var ci = document.getElementById('cdin'); var cv = ci ? ci.value.trim().replace(/^.*[?&]startapp=m_/, '').replace(/^m_/, '') : ''; if (cv) redeem(cv, false); return; }
    if (a === 'medplay') { medPlayPause(); return; }
    if (a === 'prayread') { prayerRead(); return; }
    if (a === 'remtog') {
      if (!S.rem) return;
      var w = t.dataset.w, key2 = w === 'm' ? 'mOn' : 'eOn', next = !S.rem[key2], patch = {}; patch[key2] = next;
      if (next && inTG && ver('6.9') && TG.requestWriteAccess) {
        try { TG.requestWriteAccess(function (allowed) { if (allowed) remSave(patch); else setStatus('Чтобы получать напоминания, разрешите боту писать вам', true); }); } catch (x) { remSave(patch); }
      } else remSave(patch);
      return;
    }
    if (a === 'note') { openNote(hid, +t.dataset.y, +t.dataset.m, +t.dataset.d); return; }
    if (a === 'ntag') { var tc = t.dataset.t, ix = NS ? NS.tags.indexOf(tc) : -1; if (NS) { if (ix >= 0) NS.tags.splice(ix, 1); else NS.tags.push(tc); t.setAttribute('aria-pressed', ix < 0); } return; }
    if (a === 'nsave') { hit('note'); if (NS) { saveNote(NS.hid, NS.y, NS.m, NS.d, document.getElementById('ntext').value, NS.tags); closeSheet(); render(); toast(checkAwards()); } return; }
    if (a === 'ndel') { if (NS) { saveNote(NS.hid, NS.y, NS.m, NS.d, '', []); closeSheet(); render(); } return; }
    if (a === 'nclose') { closeSheet(); return; }
    if (a === 'journal') { UI.journal = hid; UI.confirm = null; render(); window.scrollTo(0, 0); return; }
    if (a === 'jback') { UI.journal = null; render(); window.scrollTo(0, 0); return; }
    if (a === 'tab') { UI.journal = null; UI.tab = t.dataset.v; UI.scrolled = false; UI.confirm = null; S.meta.tab = UI.tab; mark('meta'); render(); window.scrollTo(0, 0); return; }
    if (a === 'mnav') { var d = new Date(UI.vy, UI.vm + (+t.dataset.v), 1); UI.vy = d.getFullYear(); UI.vm = d.getMonth(); UI.scrolled = false; render(); return; }
    if (a === 'toggle') { hit('mark'); toggle(+t.dataset.y, +t.dataset.m, +t.dataset.d, hid); render(); toast(checkAwards()); remSync(); return; }
    if (a === 'topath') { UI.tab = 'path'; UI.confirm = null; S.meta.tab = 'path'; mark('meta'); render(); window.scrollTo(0, 0); return; }
    if (a === 'pick') { UI.sel = { y: +t.dataset.y, m: +t.dataset.m, d: +t.dataset.d }; render(); return; }
    if (a === 'wk') { var s = UI.sel, nd = new Date(s.y, s.m, s.d + (+t.dataset.v)); UI.sel = { y: nd.getFullYear(), m: nd.getMonth(), d: nd.getDate() }; render(); return; }
    if (a === 'gotoday') { UI.sel = { y: TY, m: TM, d: TD }; render(); return; }
    if (a === 'cleardemo') { leaveDemo(); render(); return; }
    if (a === 'add') { addHabit(); return; }
    if (a === 'up' || a === 'down') {
      var i = S.habits.findIndex(function (h) { return h.id === hid; }), j = a === 'up' ? i - 1 : i + 1;
      if (i < 0 || j < 0 || j >= S.habits.length) return;
      leaveDemo(); var tmp = S.habits[i]; S.habits[i] = S.habits[j]; S.habits[j] = tmp; mark('habits'); render(); return;
    }
    if (a === 'del') { UI.confirm = 'del:' + hid; render(); return; }
    if (a === 'delyes') {
      if (S.habits.length > 1) {
        leaveDemo();
        S.habits = S.habits.filter(function (h) { return h.id !== hid; }); mark('habits');
        Object.keys(S.checks).forEach(function (k) { if (S.checks[k][hid] != null) { delete S.checks[k][hid]; mark('m_' + k); } });
        Object.keys(S.notes).forEach(function (k) { if (k.indexOf(hid + '|') === 0) { var wk = k.split('|')[1]; delete S.notes[k]; mark('n_' + hid + '_' + wk); } });
      }
      UI.confirm = null; render(); return;
    }
    if (a === 'reset') { UI.confirm = 'reset'; render(); return; }
    if (a === 'resetyes') { remSync(); leaveDemo(); Object.keys(S.checks).forEach(function (k) { mark('m_' + k); }); S.checks = {}; UI.confirm = null; render(); return; }
    if (a === 'no') { UI.confirm = null; render(); return; }
  });
  function addHabit() {
    var inp = document.getElementById('newHabit'); if (!inp) return;
    var name = inp.value.trim(); if (!name || S.habits.length >= MAXH) { inp.focus(); return; }
    leaveDemo();
    S.habits.push({ id: 'h' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36), name: name.slice(0, 40) });
    mark('habits'); UI.confirm = null; render();
    var n2 = document.getElementById('newHabit'); if (n2) n2.focus();
  }
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'ntext') { var cn = document.getElementById('ncnt'); if (cn) cn.textContent = t.value.length + ' / ' + NOTE_MAX; return; }
    if (t.matches && t.matches('input[data-hid]')) {
      var h = S.habits.find(function (x) { return x.id === t.dataset.hid; });
      if (h) { leaveDemo(); h.name = t.value.slice(0, 40); mark('habits'); }
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheetEl.hidden) { closeSheet(); return; }
    if (e.key === 'Escape' && !ovEl.hidden) { closeCard(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.id === 'flip') { e.preventDefault(); if (!todayCardN()) drawCard(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'newHabit') { e.preventDefault(); addHabit(); }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.matches && t.matches('select.sel') && S.rem) { var p = {}; p[t.dataset.w === 'm' ? 'm' : 'e'] = t.value; remSave(p); }
  });

  load();
})();
</script>
</body>
</html>
